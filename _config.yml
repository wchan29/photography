name: Anson Chan 
title: 📸 Anson's Photography Page

frame_padding: 10px

column: 3
column_gap: 15px
row_gap: 15px

small_screen:
  column: 2
  column_gap: 10px
  row_gap: 10px

process:
  keep_order: True
  album:
    sort_by_time: True # False: sort by filename
    order_by: create # access, modify
    reverse: False
  photo:
    sort_by_time: False
    order_by: modify
    reverse: True
    min_width: 600
    watermark:
      thumbnail: False
      original: True
      fontsize: 40
      fontfamily: Eczar-Medium.ttf
      rotate: 0

instagram: 

sass:
  sass_dir: _sass
  style: compressed
